name: Compilar EXE para Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar librerías requeridas
      run: |
        python -m pip install --upgrade pip
        pip install rich pyinstaller

    - name: Compilar a .exe con PyInstaller
      run: |
        pyinstaller --onefile --name="omni_aic" omni_aic.py

    - name: Guardar el archivo ejecutable como Artifact
      uses: actions/upload-artifact@v3
      with:
        name: omni_aic_exe
        path: dist/omni_aic.exe
