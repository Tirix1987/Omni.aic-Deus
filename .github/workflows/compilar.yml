name: Compilar EXE para Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías requeridas
      run: |
        python -m pip install --upgrade pip
        pip install rich pyinstaller

    - name: Compilar script a ejecutable (.exe)
      run: |
        pyinstaller --onefile --clean --name="omni_aic" omni_aic.py

    - name: Subir ejecutable como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: omni_aic_exe
        path: dist/omni_aic.exe
